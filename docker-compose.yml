version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: erp_postgres
    environment:
      POSTGRES_DB: erp_db
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp_password}
    # Loopback only: a published 0.0.0.0 port would put the database (and its
    # default password) on the network. Use an SSH tunnel to reach it remotely.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_user -d erp_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erp_backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_defaults &&
             gunicorn --bind 0.0.0.0:8000 --worker-class gthread --threads 8 config.wsgi:application"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      # Development defaults. For any shared or internet-facing host, export
      # SECRET_KEY, DEBUG=False and POSTGRES_PASSWORD before `docker compose up`;
      # the backend refuses to start in production with the default key.
      - SECRET_KEY=${SECRET_KEY:-django-insecure-docker-secret-key-12345}
      - DEBUG=${DEBUG:-True}
      - DATABASE_URL=postgres://erp_user:${POSTGRES_PASSWORD:-erp_password}@postgres:5432/erp_db
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:80
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: erp_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erp_scheduler
    command: python manage.py run_scheduler
    volumes:
      - ./backend:/app
    environment:
      # Development defaults. For any shared or internet-facing host, export
      # SECRET_KEY, DEBUG=False and POSTGRES_PASSWORD before `docker compose up`;
      # the backend refuses to start in production with the default key.
      - SECRET_KEY=${SECRET_KEY:-django-insecure-docker-secret-key-12345}
      - DEBUG=${DEBUG:-True}
      - DATABASE_URL=postgres://erp_user:${POSTGRES_PASSWORD:-erp_password}@postgres:5432/erp_db
    depends_on:
      - backend

volumes:
  postgres_data:
