name: CI Workflow

on:
  # Every branch: work lands from feature and agent branches, and a red suite
  # must be caught before it is merged, not after.
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    env:
      # Throwaway key: settings refuse to load without DEBUG or a real key.
      SECRET_KEY: ci-only-not-a-secret-0123456789abcdefghijklmnopqrstuvwxyz
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          sudo apt-get install -y --no-install-recommends gettext
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django Check & Integrity
        run: |
          cd backend
          python manage.py check
          python manage.py makemigrations --check
          python manage.py migrate
          python manage.py compilemessages

      - name: Run Pytest
        run: |
          cd backend
          pytest

  frontend-lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint & Build
        run: |
          cd frontend
          npm run lint
          npm run i18n:check
          npm run build
