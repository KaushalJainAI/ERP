name: CI Workflow

on:
  # Every branch: work lands from feature and agent branches, and a red suite
  # must be caught before it is merged, not after.
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django Check & Integrity
        run: |
          cd backend
          python manage.py check
          python manage.py makemigrations --check
          python manage.py migrate

      - name: Run Pytest
        run: |
          cd backend
          pytest

  frontend-lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint & Build
        run: |
          cd frontend
          npm run lint
          npm run build
